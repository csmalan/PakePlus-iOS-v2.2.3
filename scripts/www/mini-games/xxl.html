<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>KILLER QUEEN · 吉良吉影消消乐</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a2f2f 0%, #0b1c1c 100%);

            display: flex;
            justify-content: center;

            margin: 0;
            padding: 12px;
            touch-action: pan-x pan-y;
        }

        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 40% 30%, #2c6b5e, #07212e);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
            transition: opacity 0.4s ease;
            flex-direction: column;
            cursor: pointer;
        }

        .start-card {
            background: rgba(255, 245, 220, 0.97);
            border-radius: 70px;
            padding: 30px 20px 40px;
            text-align: center;
            width: 330px;
            box-shadow: 0 35px 50px rgba(0,0,0,0.5), inset 0 1px 4px rgba(255,250,200,0.9);
            border: 1px solid #ffda99;
        }

        .start-card h1 {
            font-size: 2.2rem;
            margin: 0 0 5px;
            background: linear-gradient(135deg, #c23b1a, #f5a742);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .gem-icons {
            font-size: 2.3rem;
            letter-spacing: 10px;
            margin: 8px 0;
        }

        .start-card p {
            color: #4a2a12;
            font-weight: 600;
            margin: 12px 0;
            font-size: 0.9rem;
        }

        .start-btn {
            background: linear-gradient(145deg, #ffaa44, #e07c1f);
            border: none;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 60px;
            color: #2c1a08;
            cursor: pointer;
            box-shadow: 0 6px 0 #8b4513;
            transition: 0.07s linear;
            width: 85%;
            margin: 12px auto;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8b4513;
        }

        .resume-banner {
            background: #e8c56e;
            border-radius: 40px;
            padding: 8px;
            margin: 12px auto;
            font-size: 0.8rem;
            font-weight: bold;
            color: #3a2a0a;
            width: 90%;
        }

        .easter-egg {
            position: fixed;
            font-size: 48px;
            font-weight: bold;
            color: #ff3366;
            text-shadow: 3px 3px 0 #fff;
            z-index: 2000;
            pointer-events: none;
            transform: rotate(-15deg);
            animation: floatBoki 1.5s ease-out forwards;
        }

        @keyframes floatBoki {
            0% { opacity: 1; transform: rotate(-15deg) scale(0.5); top: 50%; left: 50%; }
            100% { opacity: 0; transform: rotate(15deg) scale(2); top: 20%; left: 80%; }
        }

        .floating-text {
            position: fixed;
            pointer-events: none;
            z-index: 1500;
            font-weight: bold;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
            animation: fadeUp 2s ease-out forwards;
            white-space: pre-wrap;
            text-align: center;
            line-height: 1.3;
            font-size: 1.4rem;
            max-width: 80%;
        }

        @keyframes fadeUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            70% { opacity: 1; transform: translateY(-30px) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }

        .particle {
            position: fixed;
            pointer-events: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: gold;
            z-index: 1600;
            animation: particleFly 0.8s ease-out forwards;
        }
        @keyframes particleFly {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
        }

        .game-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 56px;
            padding: 12px 14px 18px;
            backdrop-filter: blur(4px);
            display: none;
            max-width: 650px;
            width: 100%;

        .game-panel {

            border-radius: 44px;

        }

        .stats-bar {
            display: flex;

            justify-content: space-between;
            gap: 8px;
            margin-bottom: 14px;
            background: #1e3a2c;
            border-radius: 60px;
            padding: 6px 12px;
        }

        .stat {

        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 800;
            line-height: 1;
            color: #3b1f07;
        }

        .timer-bar {

            margin: 6px 0;

        }

        }
        @keyframes pulseRed {
            from { box-shadow: 0 0 2px #ff4444; }

        }

        .timer-fill {
            width: 100%;
            height: 100%;
            background: #f5b042;
            border-radius: 20px;

            box-shadow: inset 0 0 0 1px #fff3cf, 0 2px 6px black;
        }

        .props-bar {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin: 10px 0 12px;
        }

        .prop-item {
            background: #2f281d;
            border-radius: 48px;

            gap: 6px;
            color: #ffefb0;

            display: block;
            margin: 0 auto;
            border-radius: 32px;
            box-shadow: 0 6px 16px black, inset 0 0 0 3px rgba(255, 240, 170, 0.8);
            cursor: grab;
            width: 100%;
            height: auto;
            background: #2a3422;
            touch-action: none;

        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

            background: #f7bc5c;
            border: none;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 40px;
            font-family: inherit;
            font-size: 0.8rem;

            .prop-icon { font-size: 1rem; }
            .goal-banner { font-size: 0.7rem; }
            button { padding: 4px 8px; font-size: 0.7rem; }
            .floating-text { font-size: 1rem; }
        }
    </style>
</head>
<body>

<div id="startScreen" class="start-screen">

</div>

        // 音效系统
        let audioCtx = null;
        let soundEnabled = false;
        function initAudio() {
            if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                soundEnabled = true;
            }
        }
        function playTone(freq, type, duration, volume=0.2) {
            if (!soundEnabled || !audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = type || 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.start();
            osc.stop(now + duration);
        }
        function playMatchSound(matchCount) {
            if (!soundEnabled) return;
            let baseFreq = 660;
            if (matchCount === 3) baseFreq = 523.25;
            else if (matchCount === 4) baseFreq = 659.25;
            else if (matchCount >= 5) baseFreq = 783.99;
            playTone(baseFreq, 'sine', 0.25, 0.25);
            playTone(baseFreq * 2, 'triangle', 0.2, 0.15);
        }
        function playCollectSound() { playTone(1046.50, 'sine', 0.2, 0.2); setTimeout(() => playTone(1318.52, 'sine', 0.2, 0.15), 50); }
        function playPropSound() { playTone(440, 'square', 0.15, 0.2); setTimeout(() => playTone(587.33, 'square', 0.15, 0.2), 100); }
        function playWinSound() { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.3, 0.25), i * 120)); }
        function playFailSound() { playTone(440, 'sawtooth', 0.4, 0.2); setTimeout(() => playTone(349.23, 'sawtooth', 0.5, 0.2), 200); }
        function playExplosionSound() {
            if (!soundEnabled || !audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const bufferSize = 4096;
            const noise = audioCtx.createScriptProcessor(bufferSize, 1, 1);
            noise.onaudioprocess = function(e) {
                const output = e.outputBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
            };
            const gain = audioCtx.createGain();
            noise.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
            noise.start();
            noise.stop(now + 0.5);
            setTimeout(() => noise.disconnect(), 600);
        }
        
        // 视觉特效
        function spawnParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.backgroundColor = color;
                particle.style.left = (x + (Math.random() - 0.5) * 40) + 'px';
                particle.style.top = (y + (Math.random() - 0.5) * 40) + 'px';
                const dx = (Math.random() - 0.5) * 150;
                const dy = (Math.random() - 0.5) * 150 - 50;
                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }
        }
        function showFloatingText(text, color, xRatio = null, yRatio = null, spawnParticlesFlag = false) {
            const div = document.createElement('div');
            div.className = 'floating-text';
            div.innerHTML = text;
            div.style.color = color;
            div.style.fontSize = window.innerWidth < 500 ? '1.1rem' : '1.4rem';
            const left = (xRatio !== null ? xRatio : Math.random() * 70 + 15);
            const top = (yRatio !== null ? yRatio : Math.random() * 60 + 20);
            div.style.left = left + '%';
            div.style.top = top + '%';
            document.body.appendChild(div);
            if (spawnParticlesFlag) {
                const rect = div.getBoundingClientRect();
                spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2, 8, color);
            }

        // 核心游戏逻辑函数 (与之前相同，略作精简但保留完整功能)
        function getAllMatches(board) { /* 同前 */ 
            const matches = [];
            for(let r=0; r<ROWS; r++) {
                let len = 1;
                for(let c=1; c<=COLS; c++) {
                    if(c<COLS && board[r][c] === board[r][c-1] && board[r][c] !== -1) len++;
                    else {
                        if(len>=3) {
                            let set = new Set();
                            for(let i=c-len; i<c; i++) set.add(`${r},${i}`);
                            matches.push(set);
                        }
                        len=1;
                    }
                }
            }
            for(let c=0; c<COLS; c++) {
                let len = 1;
                for(let r=1; r<=ROWS; r++) {
                    if(r<ROWS && board[r][c] === board[r-1][c] && board[r][c] !== -1) len++;
                    else {
                        if(len>=3) {
                            let set = new Set();
                            for(let i=r-len; i<r; i++) set.add(`${i},${c}`);
                            matches.push(set);
                        }
                        len=1;
                    }
                }
            }
            return matches;
        }
        function calcMatchReward(matchGroups, board) {
            let score = 0, collect = 0;
            for(let group of matchGroups) {
                let cnt = group.size;
                if(cnt>=3){
                    score += cnt * BASE_SCORE;
                    if(cnt===4) score += BONUS_4;
                    if(cnt>=5) score += BONUS_5;
                    for(let cell of group) {
                        let [r,c] = cell.split(',').map(Number);
                        if(board[r][c] === targetCollectType) collect++;
                    }
                }
            }
            return {score, collect};
        }
        function applyEliminateAndDrop(board, matchGroups) {
            const toClear = new Set();
            for(let group of matchGroups) for(let cell of group) toClear.add(cell);
            for(let cell of toClear) { let [r,c]=cell.split(',').map(Number); board[r][c] = -1; }
            for(let c=0; c<COLS; c++) {
                let colVals = [];
                for(let r=0; r<ROWS; r++) if(board[r][c] !== -1) colVals.push(board[r][c]);
                let missing = ROWS - colVals.length;
                let newCol = [];
                for(let i=0; i<missing; i++) newCol.push(Math.floor(Math.random() * TYPES));
                newCol.push(...colVals);
                for(let r=0; r<ROWS; r++) board[r][c] = newCol[r];
            }
        }
        function settleBoardSync(board, applyReward = false) {
            let maxLoop = 50;
            while(maxLoop-- > 0) {
                const matches = getAllMatches(board);
                if(matches.length === 0) break;
                if(applyReward) { const {score, collect}=calcMatchReward(matches,board); currentScore+=score; collectedAmount+=collect; updateUI(); }
                applyEliminateAndDrop(board, matches);
            }
        }
        function generateStableBoard() {
            for(let attempt=0; attempt<40; attempt++) {
                let testBoard = Array(ROWS).fill().map(()=>Array(COLS).fill().map(()=>Math.floor(Math.random()*TYPES)));
                settleBoardSync(testBoard, false);
                if(hasAnyValidMove(testBoard)) return testBoard;
            }
            let fallback = Array(ROWS).fill().map(()=>Array(COLS).fill().map(()=>Math.floor(Math.random()*TYPES)));
            settleBoardSync(fallback, false);
            return fallback;
        }
        async function animateChainReaction(addToState = true) {
            let board = grid;
            let loopGuard = 0;
            while(loopGuard < 30) {
                const matches = getAllMatches(board);
                if(matches.length === 0) break;
                let reward = {score:0, collect:0};
                if(addToState) reward = calcMatchReward(matches, board);
                const cellsToAnimate = [];
                let totalMatchSize = 0;
                for(let group of matches) { totalMatchSize += group.size; for(let cell of group) cellsToAnimate.push(cell); }
                await playEliminateAnimation(cellsToAnimate);
                playMatchSound(Math.min(5, Math.floor(totalMatchSize / 3) + 3));
                showRandomKiraQuote();
                applyEliminateAndDrop(board, matches);
                drawBoard();
                await delay(60);
                if(addToState && (reward.score>0 || reward.collect>0)) {
                    currentScore += reward.score;
                    if (reward.collect > 0) { collectedAmount += reward.collect; showCollectGain(reward.collect, targetCollectType); }
                    updateUI();
                    if(checkLevelComplete()) return;
                    if(checkGameOver()) return;
                }
                drawBoard();
                await delay(45);
                loopGuard++;
            }
            if(gameActive && !hasAnyValidMove(board)) { showMessage("🃏 无可用交换，自动洗牌", false); await delay(250); await reshuffleBoard(false, true); }
        }
        function playEliminateAnimation(cells) {
            return new Promise((resolve) => {
                const duration = 160;
                const startTime = performance.now();
                const animSet = new Set(cells);
                function step(now) {
                    const elapsed = now - startTime;
                    let t = Math.min(1, elapsed / duration);
                    let scale = 1 - t * 0.7;
                    let alpha = 1 - t;
                    drawBoardWithEffect(animSet, scale, alpha);
                    if(t < 1) requestAnimationFrame(step);
                    else { drawBoard(); resolve(); }
                }
                requestAnimationFrame(step);
            });
        }
        function drawBoardWithEffect(cellsSet, scale, alpha) {
            const w = canvas.width, h = canvas.height;
            cellW = w/COLS; cellH = h/ROWS;
            ctx.clearRect(0,0,w,h);
            for(let r=0;r<ROWS;r++){
                for(let c=0;c<COLS;c++){
                    let val = grid[r][c];
                    let x = c*cellW, y = r*cellH;
                    let isAnim = cellsSet.has(`${r},${c}`);
                    let s = isAnim ? scale : 1;
                    let a = isAnim ? alpha : 1;
                    let offX = (cellW*(1-s))/2;
                    let offY = (cellH*(1-s))/2;
                    ctx.save();
                    if(a<1) ctx.globalAlpha = a;
                    ctx.fillStyle = "#2b2a1f";
                    ctx.fillRect(x,y,cellW,cellH);
                    if(val>=0 && val<TYPES){
                        let grad = ctx.createLinearGradient(x+5,y+5,x+cellW-10,y+cellH-10);
                        grad.addColorStop(0, GEM_COLORS[val]);
                        grad.addColorStop(1, "#c97d3e");
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.roundRect(x+offX+2, y+offY+2, cellW*s-4, cellH*s-4, 12);
                        ctx.fill();
                        ctx.fillStyle = "#fff8eaf0";
                        ctx.font = `bold ${Math.floor(cellW*0.42)}px "Segoe UI", "Apple Color Emoji"`;
                        ctx.fillText(GEM_ICONS[val], x+cellW*0.28, y+cellH*0.75);
                    }
                    ctx.restore();
                }
            }
            if(selectedProp === 'bomb' && gameActive && !isPaused){
                ctx.save();
                ctx.strokeStyle = "#ffcc77";
                ctx.lineWidth = 3;
                for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ ctx.beginPath(); ctx.roundRect(c*cellW+2, r*cellH+2, cellW-4, cellH-4, 12); ctx.stroke(); }
                ctx.restore();
            }
        }
        async function performSwapWithAnimation(r1,c1, r2,c2, consumeMove=true) {
            if(!gameActive || isPaused) return false;
            if(processing) { showMessage("动画中，请稍后", true); return false; }

            swap(testBoard, r1,c1, r2,c2);

            processing = false;

        }
        async function reshuffleBoard(consume=true, silent=false) {
            if(!gameActive || isPaused) return;
            if(processing) { if(!silent) showMessage("请稍后", true); return; }
            processing = true;
            let newBoard = null;
            for(let i=0;i<25;i++) {
                let test = Array(ROWS).fill().map(()=>Array(COLS).fill().map(()=>Math.floor(Math.random()*TYPES)));
                settleBoardSync(test, false);
                if(hasAnyValidMove(test)) { newBoard = test; break; }
            }
            if(!newBoard) newBoard = copyGrid(grid);
            grid = newBoard;
            drawBoard();
            if(consume && gameActive) { if(shuffleCount > 0) shuffleCount--; else { processing=false; return; } updateUI(); if(!silent) showMessage("♻️ 牌局已洗", false); playPropSound(); }
            await animateChainReaction(false);

        async function useBombAnim(row, col) {
            if(!gameActive || isPaused) return false;
            if(processing) { showMessage("动画中", true); return false; }
            if(bombCount <= 0) { showMessage("炸弹不足", true); return false; }
            processing = true;
            let bombCells = [];
            for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++) {
                let nr=row+dr, nc=col+dc;
                if(nr>=0 && nr<ROWS && nc>=0 && nc<COLS) bombCells.push([nr,nc]);
            }
            const bombSet = new Set(bombCells.map(([r,c])=>`${r},${c}`));
            await playEliminateAnimation(bombSet);

            for(let [r,c] of bombCells) grid[r][c] = -1;
            applyGravityAndFill(grid);

            processing = false;
            drawBoard();

        function useStepItem() {
            if(!gameActive || isPaused) return;
            if(stepBonusCount <= 0) { showMessage("步数道具不足", true); return; }
            remainingMoves += 3; stepBonusCount--; updateUI(); playPropSound(); showMessage("⏫ 获得额外3步", false); checkGameOver();
        }
        function copyGrid(board) { return board.map(row=>[...row]); }
        function swap(board, r1,c1, r2,c2) { let t=board[r1][c1]; board[r1][c1]=board[r2][c2]; board[r2][c2]=t; }
        function applyGravityAndFill(board) {
            for(let c=0;c<COLS;c++){
                let col=[]; for(let r=0;r<ROWS;r++) if(board[r][c]!==-1) col.push(board[r][c]);
                let miss=ROWS-col.length; let newCol=[];
                for(let i=0;i<miss;i++) newCol.push(Math.floor(Math.random()*TYPES));
                newCol.push(...col);
                for(let r=0;r<ROWS;r++) board[r][c]=newCol[r];
            }
        }
        function hasAnyValidMove(board) {
            for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
                if(c+1<COLS){ let cp=copyGrid(board); swap(cp,r,c,r,c+1); if(getAllMatches(cp).length>0) return true; }
                if(r+1<ROWS){ let cp=copyGrid(board); swap(cp,r,c,r+1,c); if(getAllMatches(cp).length>0) return true; }
            }
            return false;
        }
        function delay(ms) { return new Promise(res=>setTimeout(res,ms)); }
        
        function startTimer() {

            }, 1000);

        function checkLevelComplete() {

        function resetCurrentLevel() {

        function nextLevel() { if(processing) return; currentLevel++; resetCurrentLevel(); }
        
        function drawBoard() {
            const w = canvas.width, h = canvas.height;
            cellW = w/COLS; cellH = h/ROWS;
            ctx.clearRect(0,0,w,h);
            for(let r=0;r<ROWS;r++){
                for(let c=0;c<COLS;c++){
                    let val = grid[r][c];
                    let x = c*cellW, y = r*cellH;
                    ctx.fillStyle = "#2d3322";
                    ctx.fillRect(x,y,cellW,cellH);
                    if(val>=0 && val<TYPES){
                        let grad = ctx.createLinearGradient(x+4, y+4, x+cellW-8, y+cellH-8);
                        grad.addColorStop(0, GEM_COLORS[val]);
                        grad.addColorStop(1, "#c97a3a");
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.roundRect(x+3, y+3, cellW-6, cellH-6, 12);
                        ctx.fill();
                        ctx.fillStyle = "#fff8eef0";
                        ctx.font = `bold ${Math.floor(cellW*0.42)}px "Segoe UI", "Apple Color Emoji"`;
                        ctx.fillText(GEM_ICONS[val], x+cellW*0.28, y+cellH*0.75);
                        ctx.strokeStyle = "#fff9cf80";
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.roundRect(x+4, y+4, cellW-8, cellH-8, 10);
                        ctx.stroke();
                    }
                }
            }
            if(isPaused && gameActive){
                ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0,0,w,h);
                ctx.fillStyle = "#ffdd99"; ctx.font = `bold ${Math.floor(w*0.08)}px system-ui`; ctx.textAlign = "center"; ctx.fillText("⏸ 暂停中", w/2, h/2); ctx.textAlign = "left";
            } else if(!gameActive && collectedAmount >= targetCollectAmount){
                ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0,0,w,h); ctx.fillStyle = "#ffdd99"; ctx.font = `bold ${Math.floor(w*0.07)}px system-ui`; ctx.textAlign="center"; ctx.fillText("✨ 通关 ✨", w/2, h/2);
            } else if(!gameActive && (remainingMoves<=0 || timeLeft<=0)){
                ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0,0,w,h); ctx.fillStyle = "#ffb277"; ctx.fillText("失败", w/2, h/2);
            }
            ctx.textAlign="left";
        }
        
        // 触摸交互
        function getCellFromCoord(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            if(canvasX<0 || canvasY<0) return null;
            let col = Math.floor(canvasX / cellW);
            let row = Math.floor(canvasY / cellH);
            if(row>=0 && row<ROWS && col>=0 && col<COLS) return {row,col};
            return null;
        }
        function onTouchStart(e) { if(isPaused || !gameActive || processing) return; e.preventDefault(); let point = e.touches ? e.touches[0] : e; let coord = getCellFromCoord(point.clientX, point.clientY); if(coord) { touchStartRow = coord.row; touchStartCol = coord.col; isDragging = true; } }
        function onTouchMove(e) { if(isPaused || !gameActive || processing || !isDragging) return; e.preventDefault(); let point = e.touches ? e.touches[0] : e; let coord = getCellFromCoord(point.clientX, point.clientY); if(coord && (touchStartRow !== coord.row || touchStartCol !== coord.col)) { let dr = Math.abs(coord.row - touchStartRow), dc = Math.abs(coord.col - touchStartCol); if(dr+dc === 1) { performSwapWithAnimation(touchStartRow, touchStartCol, coord.row, coord.col, true); isDragging = false; touchStartRow = -1; } else isDragging = false; } }
        function onTouchEnd(e) { e.preventDefault(); isDragging = false; touchStartRow = -1; }
        canvas.addEventListener('mousedown', onTouchStart); canvas.addEventListener('mousemove', onTouchMove); canvas.addEventListener('mouseup', onTouchEnd);
        canvas.addEventListener('touchstart', onTouchStart, {passive:false}); canvas.addEventListener('touchmove', onTouchMove, {passive:false}); canvas.addEventListener('touchend', onTouchEnd);
        canvas.addEventListener('click', async (e) => { if(selectedProp === 'bomb' && gameActive && !isPaused && !processing && bombCount > 0) { let clientX = e.clientX; let clientY = e.clientY; if (e.touches) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } const coord = getCellFromCoord(clientX, clientY); if(coord) { await useBombAnim(coord.row, coord.col); clearPropActiveStyle(); } e.preventDefault(); } });
        function clearPropActiveStyle() { selectedProp = null; drawBoard(); }
        
        let propDebounce = false;
        function withPropGuard(fn) { return async function() { if (propDebounce) return; propDebounce = true; try { await fn(); } finally { setTimeout(() => { propDebounce = false; }, 300); } }; }
        document.getElementById('propBomb').addEventListener('click', withPropGuard(async () => { if(gameActive && !isPaused && !processing && bombCount>0) { selectedProp = 'bomb'; showMessage("💣 点击任意宝石引爆", false); drawBoard(); } else showMessage("炸弹不足", true); }));
        document.getElementById('propShuffle').addEventListener('click', withPropGuard(async () => { if(shuffleCount>0 && gameActive && !isPaused && !processing) { await reshuffleBoard(true, false); clearPropActiveStyle(); } else showMessage("洗牌不可用", true); }));
        document.getElementById('propStep').addEventListener('click', withPropGuard(async () => { if(!isPaused) useStepItem(); clearPropActiveStyle(); }));
        document.getElementById('resetLevelBtn').addEventListener('click', () => { if(!processing) resetCurrentLevel(); clearPropActiveStyle(); });
        document.getElementById('backHomeBtn').addEventListener('click', () => { document.getElementById('gameContainer').style.display='none'; document.getElementById('startScreen').style.display='flex'; stopTimer(); if(bgm) bgm.pause(); musicEnabled=false; musicToggleBtn.innerText='🎵 音乐 OFF'; });
        musicToggleBtn.addEventListener('click', toggleMusic);
        pauseBtn.addEventListener('click', togglePause);
        
        // 开始界面逻辑
        const startNewBtn = document.getElementById('startNewBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const resumePanel = document.getElementById('resumePanel');
        function checkAndShowResume() {
            const hasSave = localStorage.getItem('kira_save') !== null;
            if (hasSave) {
                resumePanel.style.display = 'block';
                resumeBtn.style.display = 'block';
                startNewBtn.innerText = '🗑️ 新游戏 (清除存档)';
            } else {
                resumePanel.style.display = 'none';
                resumeBtn.style.display = 'none';
                startNewBtn.innerText = '▶ 新游戏';
            }
        }
        startNewBtn.addEventListener('click', () => {
            clearSave();
            document.getElementById('startScreen').style.display='none';
            document.getElementById('gameContainer').style.display='block';
            initAudio(); initMusic(); resetCurrentLevel();
        });
        resumeBtn.addEventListener('click', () => {
            document.getElementById('startScreen').style.display='none';
            document.getElementById('gameContainer').style.display='block';
            initAudio(); initMusic();
            if (!loadGame()) resetCurrentLevel();
        });
        checkAndShowResume();
        
        // 彩蛋
        let clickCount = 0;
        let easterTimeout = null;
        const startScreenDiv = document.getElementById('startScreen');
        startScreenDiv.addEventListener('click', (e) => { if(e.target.closest('.start-btn')) return; clickCount++; if(easterTimeout) clearTimeout(easterTimeout); easterTimeout = setTimeout(() => { clickCount = 0; }, 800); if(clickCount >= 5) { clickCount = 0; const egg = document.createElement('div'); egg.className = 'easter-egg'; egg.innerText = 'boki'; egg.style.left = Math.random() * 70 + 15 + '%'; egg.style.top = Math.random() * 70 + 15 + '%'; document.body.appendChild(egg); setTimeout(() => egg.remove(), 1500); } });
        
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) { if(w<2*r) r=w/2; if(h<2*r) r=h/2; this.moveTo(x+r,y); this.lineTo(x+w-r,y); this.quadraticCurveTo(x+w,y,x+w,y+r); this.lineTo(x+w,y+h-r); this.quadraticCurveTo(x+w,y+h,x+w-r,y+h); this.lineTo(x+r,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r); this.lineTo(x,y+r); this.quadraticCurveTo(x,y,x+r,y); return this; };
        }
        document.getElementById('gameContainer').style.display = 'none';
    })();
</script>
</body>
</html>
