    function renderGame(){ if(!gameState)return;if(gameState.gameOver){showEnding(gameState.ending);return;}const s=gameState;let html=`<div class="player-id">编号: ${playerId}</div><div class="game-header flex-row"><span>第${s.turn}天 🚀${s.distance}/${TARGET_DISTANCE}</span><button class="btn small" id="save-btn">💾保存</button><button class="btn small danger" id="surr-btn">🏳️投降</button><button class="btn small danger" id="exit-btn">🚪退出</button></div><div class="resource-strip">${['energy','alloy','nobleGas','biomass'].map(k=>`<span class="resource-chip">${ICONS[k]}${s[k]}</span>`).join('')}</div><div class="flex-row" style="font-size:12px">${Object.entries(s.modules).map(([k,v])=>`<span>${ICONS[k]||''}${Math.round(v*100)}%</span>`).join(' ')}</div><div class="tab-bar">${['assign','status','inventory','craft','safebox'].map(t=>`<div class="tab ${s.activeTab===t?'active':''}" data-tab="${t}">${t==='assign'?'任务':t==='status'?'状态':t==='inventory'?'背包':t==='safebox'?'安全箱':'合成'}</div>`).join('')}</div><div id="game-tab-content"></div>`;screens.game.innerHTML=html;screens.game.querySelectorAll('.tab').forEach(t=>t.onclick=(e)=>{gameState.activeTab=e.target.dataset.tab;renderGame();});document.getElementById('save-btn').onclick=()=>{storage.set('tides_game_save',gameState);showToast('已保存');playPreloaded('kick',0.7);};document.getElementById('surr-btn').onclick=()=>{if(confirm('确定投降？')){gameState.gameOver=true;gameState.ending='END_SURRENDER';storage.remove('tides_game_save');showEnding('END_SURRENDER');}};document.getElementById('exit-btn').onclick=()=>{if(confirm('返回主菜单？'))navigate('start');};renderGameTab(); }
    function renderGameTab(){ const cont=document.getElementById('game-tab-content');const s=gameState;const avail=s.crew.filter(c=>!c.dead&&!c.onMission);const alreadyScav=s.crew.some(c=>c.onMission)||Object.values(s.dailyAssignments).some(a=>a.task==='scavenge');if(s.activeTab==='assign'){cont.innerHTML=avail.map(c=>{const a=s.dailyAssignments[c.id];let desc=a?(a.task==='scavenge'?`搜寻 ${LOCATIONS.find(l=>l.id===a.locationId)?.name}`:a.task):'未分配';return`<div class="crew-card"><span>${c.icon} ${c.name}</span> ${desc} <div class="flex-row"><button class="btn small assign-btn" data-c="${c.id}">分配</button><button class="btn small use-item-assign" data-c="${c.id}">使用道具</button></div></div>`;}).join('')+`<button class="btn" id="process-day">开始新的一天</button>`;cont.querySelectorAll('.assign-btn').forEach(b=>b.onclick=(e)=>openTaskModal(e.target.dataset.c,alreadyScav));cont.querySelectorAll('.use-item-assign').forEach(b=>b.onclick=(e)=>openItemUseModal(e.target.dataset.c));document.getElementById('process-day').onclick=processDay;}else if(s.activeTab==='status'){cont.innerHTML=s.crew.filter(c=>!c.dead).map(c=>`<div class="crew-card"><span>${c.icon}${c.name}</span> 🍖${c.hunger} 💧${c.thirst} 😊${c.morale} ${c.onMission?'(探险中)':''}<button class="btn small use-item" data-c="${c.id}">使用物品</button>${c.charId==='jiaxuan'&&!s.jiaxuanDead?`<button class="btn small use-skill" data-c="${c.id}">技能${s.skillCooldowns.jiaxuan>0?'(冷却)':''}</button>`:''}</div>`).join('');cont.querySelectorAll('.use-item').forEach(b=>b.onclick=(e)=>openItemUseModal(e.target.dataset.c));cont.querySelectorAll('.use-skill').forEach(b=>b.onclick=(e)=>useSkill(e.target.dataset.c));}else if(s.activeTab==='inventory'){const w=s.inventory.reduce((sum,i)=>sum+(ITEMS[i.id]?.weight||1)*i.quantity,0);cont.innerHTML=`<div>📦${w}/${s.inventoryCapacity}</div>`+s.inventory.map(i=>{const it=ITEMS[i.id];return`<div class="flex-row"><span class="${getItemColorClass(it.star)}">${it.icon}${it.name}</span> x${i.quantity} <button cl     function openItemUseModal(cid){ const crew=gameState.crew.find(c=>c.id===cid);if(!crew)return;let items;if(crew.charId==='chenshuo'){items=gameState.inventory.filter(i=>['material','tool','consumable'].includes(ITEMS[i.id]?.type)||['scrap','electronics','gear','wire','spring','battery'].includes(i.id));}else{items=gameState.inventory.filter(i=>['food','water','medical'].includes(ITEMS[i.id]?.type)||ITEMS[i.id]?.active);}if(items.length===0){showToast('没有可用的物品',true);return;}modalContainer.innerHTML=`<div class="modal-overlay"><div class="modal-content"><h3>使用物品给${crew.name}</h3>`+items.map(i=>{const it=ITEMS[i.id];return`<button class="btn small" data-id="${i.id}"><span class="${getItemColorClass(it.star)}">${it.icon}${it.name}</span> x${i.quantity}</button>`;}).join('')+`<button class="btn danger close-modal">取消</button></div></div>`;modalContainer.classList.remove('hidden');modalContainer.querySelectorAll('[data-id]').forEach(b=>b.onclick=(e)=>{const id=e.target.dataset.id;const idx=gameState.inventory.findIndex(i=>i.id===id);if(idx<0)return;const item=ITEMS[id];if(item.activeEffect){item.activeEffect(gameState,crew);gameState.inventory=removeItemFromInventory(gameState.inventory,id,1);modalContainer.classList.add('hidden');renderGame();return;}if(crew.charId==='chenshuo'){if(['material','tool','consumable'].includes(item.type)||['scrap','electronics','gear','wire','spring','battery'].includes(item.id)){crew.hunger=Math.min(100,crew.hunger+25);crew.thirst=Math.min(100,crew.thirst+15);crew.fatigue=Math.max(0,crew.fatigue-10);playPreloaded('chenshuo_all',0.7);if(gameState.inventory[idx].quantity>1)gameState.inventory[idx].quantity--;else gameState.inventory.splice(idx,1);modalContainer.classList.add('hidden');renderGame();}else{showToast('宸硕无法使用此物品',true);}return;}if(item.type==='food'){crew.hunger=Math.min(100,crew.hunger+item.value);if(crew.charId==='alan')playPreloaded('alan_eat',0.7);else if(crew.charId==='sunsheng')playSunshengSfx('eat');else if(crew.charId     function renderStart(){ const saved=storage.get('tides_game_save');const hasSave=saved&&!saved.gameOver;let html=`<div class="player-id">编号: ${playerId}</div><div class="title">潮汐与尘埃</div>`;const btnC=document.createElement('div');const addBtn=(txt,act)=>{const b=document.createElement('button');b.className='btn';b.textContent=txt;b.onclick=act;btnC.appendChild(b);};if(!hasSave)addBtn('开始远征',()=>{prepDifficulty=null;prepSafeItems=[];navigate('prep');});if(hasSave)addBtn('继续游戏',()=>{gameState=sanitizeState(saved);navigate('game');});addBtn('招募',()=>navigate('gacha'));addBtn('商店',()=>navigate('shop'));addBtn('仓库',()=>navigate('warehouse'));addBtn('安全箱',()=>navigate('safebox'));addBtn('天赋',()=>navigate('talent'));addBtn('编队',()=>navigate('crewselect'));addBtn('设置',()=>navigate('settings'));addBtn('图鉴',()=>navigate('pedia'));addBtn('档案',()=>navigate('archive'));addBtn('成就',()=>navigate('achievement'));addBtn('邮件'+(getUnreadMailCount()>0?` (${getUnreadMailCount()})`:''),()=>navigate('mail'));addBtn('教程',()=>startTutorial());const redeemDiv=document.createElement('div');redeemDiv.className='flex-row';redeemDiv.innerHTML=`<input id="redeem-input" placeholder="兑换码" style="flex:1;padding:12px;border-radius:12px;border:none;background:#1e3a3a;color:white;"><button class="btn small" id="redeem-btn">兑换</button>`;screens.start.innerHTML=html;screens.start.appendChild(btnC);screens.start.appendChild(redeemDiv);document.getElementById('redeem-btn').onclick=()=>{const input=document.getElementById('redeem-input');const code=input.value.toUpperCase();if(code==='FSDFFAFAEJFIIU'){metaState.diamonds+=1600;showToast('获得1600钻石！');playPreloaded('success',0.7);}else if(code==='CXYCA'){const now=Date.now();const last=metaState.redeemUsed['CXYCA']||0;if(last===0||(now-last)>86400000){metaState.redeemUsed['CXYCA']=now;Object.keys(CHARACTERS).forEach(id=>{if(!metaState.ownedCharacters.includes(id))metaState.ownedCharacters.push(id);});showToast('获得了全部角色！');playPreloaded('success',0.7);}else{showToast('今日已使用过CXYCA',true);}}else if(code==='202515'){if(!metaState.redeemUsed['202515']){metaState.redeemUsed['202515']=true;metaState.diamonds+=3200;showToast('获得3200钻石！');playPreloaded('success',0.7);}else{showToast('202515已使用过',true);}}else{showToast('无效兑换码',true);}input.value='';};if(!tutorialShown){showIntroStory();tutorialShown=true;}}
    function renderMail(){ metaState.mails=metaState.mails.filter(m=>m.expire>Date.now()||!m.claimed);let html=`<div class="player-id">编号: ${playerId}</div><div class="title">邮件</div>`;metaState.mails.forEach(m=>{html+=`<div class="crew-card"><div>${m.title}</div><p>${m.content}</p>`;if(m.rewards&&!m.claimed)html+=`<button class="btn small claim-mail" data-id="${m.id}">领取奖励</button>`;html+=`</div>`;});html+=`<button class="btn" id="back-mail">返回</button>`;screens.mail.innerHTML=html;document.querySelectorAll('.claim-mail').forEach(b=>b.onclick=(e)=>{const id=e.target.dataset.id;const mail=metaState.mails.find(m=>m.id==id);if(!mail||mail.claimed)return;mail.claimed=true;mail.rewards.forEach(r=>{if(r.type==='coin')metaState.coins+=r.amount;else if(r.type==='diamond')metaState.diamonds+=r.amount;});showToast('奖励已领取');renderMail();});metaState.mails.forEach(m=>m.read=true);document.getElementById('back-mail').onclick=()=>navigate('start'); }
    function renderGacha(){ let html=`<div class="player-id">编号: ${playerId}</div><div class="title">招募 💎${metaState.diamonds}</div><button class="btn" id="gacha1">单抽 160💎</button><button class="btn" id="gacha10">十连 1600💎</button><button class="btn" id="back-gacha">返回</button>`;screens.gacha.innerHTML=html;document.getElementById('gacha1').onclick=()=>performGacha(1);document.getElementById('gacha10').onclick=()=>performGacha(10);document.getElementById('back-gacha').onclick=()=>navigate('start'); }
    function performGacha(times){ const cost=times===1?GACHA_COST.single:GACHA_COST.ten;if(metaState.diamonds<cost){showToast('钻石不足',true);playPreloaded('de_kick',0.7);return;}metaState.diamonds-=cost;const results=[];let totalCoins=0;for(let i=0;i<times;i++){metaState.gachaPity5++;metaState.gachaPity4++;let got5=false,got4=false;if(metaState.gachaPity5>=PITY_5STAR){got5=true;metaState.gachaPity5=0;metaState.gachaPity4=0;}else if(metaState.gachaPity4>=PITY_4STAR){got4=true;metaState.gachaPity4=0;}else{let rate=BASE_5STAR_RATE;if(metaState.gachaPity5>=SOFT_PITY_START)rate+=(metaState.gachaPity5-SOFT_PITY_START)*0.005;if(metaState.gachaLuck>0){rate+=metaState.gachaLuck*0.001;metaState.gachaLuck=Math.max(0,metaState.gachaLuck-1);}const rand=Math.random();if(rand<rate){got5=true;metaState.gachaPity5=0;metaState.gachaPity4=0;}else if(rand<0.06){got4=true;metaState.gachaPity4=0;}else{metaState.gachaLuck++;}}if(got5){const pool=Math.random()<0.5?CHAR_GACHA_POOL:WEAPON_GACHA_POOL;const fives=pool.filter(p=>p.star===5);const item=fives[Math.floor(Math.random()*fives.length)];if(item.type==='character'){if(!metaState.ownedCharacters.includes(item.id))metaState.ownedCharacters.push(item.id);}else{const ex=metaState.warehouse.find(i=>i.itemId===item.id);if(ex)ex.quantity++;else metaState.warehouse.push({itemId:item.id,quantity:1});}results.push(item);totalCoins+=500;}else if(got4){const pool=Math.random()<0.5?CHAR_GACHA_POOL:WEAPON_GACHA_POOL;const fours=pool.filter(p=>p.star===4);const item=fours[Math.floor(Math.random()*fours.length)];if(item.type==='character'){if(!metaState.ownedCharacters.includes(item.id))metaState.ownedCharacters.push(item.id);}else{const ex=metaState.warehouse.find(i=>i.itemId===item.id);if(ex)ex.quantity++;else metaState.warehouse.push({itemId:item.id,quantity:1});}results.push(item);totalCoins+=200;}else{const pool=Object.values(ITEMS).filter(it=>it.star<=3);const item=pool[Math.floor(Math.random()*pool.length)];const ex=metaState.warehouse.find(i=>i.itemId===item.id);if(ex)ex.quantity++;else metaState.warehouse.push({itemId:item.id,quantity:1});results.push({type:'item',id:item.id});totalCoins+=item.price?Math.floor(item.price*0.1):10;}}metaState.coins+=totalCoins;const chooseAudio=audioPreloadMap.get('choose');const dur=chooseAudio?(chooseAudio.duration*1000):800;const anim=document.createElement('div');anim.className='gacha-animation';anim.innerHTML='<div>🎰 抽卡中...</div>';document.body.appendChild(anim);playPreloaded('choose',0.7);setTimeout(()=>{anim.remove();showGachaPopup(results);renderGacha();},dur+300); }
    function showGachaPopup(results){ const popup=document.createElement('div');popup.className='gacha-popup';popup.innerHTML=`<h3>✨ 招募结果</h3><div>${results.map(r=>{if(r.type==='character')return`<span>${CHARACTERS[r.id]?.icon}${CHARACTERS[r.id]?.name}</span>`;else return`<span>${ITEMS[r.id].icon}${ITEMS[r.id].name}</span>`;}).join('<br>')}</div><button class="btn small" id="close-popup">确定</button>`;document.body.appendChild(popup);document.getElementById('close-popup').onclick=()=>popup.remove(); }
    function getShopRefreshAvailability(){ const now=new Date();const mid=new Date(now);mid.setHours(0,0,0,0);const periods=Math.floor((now-mid)/SHOP_REFRESH_INTERVAL);return{available:Math.max(0,periods-(metaState.shopRefreshCount||0))}; }
    function renderShop(){ const avail=getShopRefreshAvailability();if(!metaState.shopItems.length){metaState.shopItems=Array.from({length:8},()=>{const ids=Object.keys(ITEMS);const id=ids[Math.floor(Math.random()*ids.length)];return{id:`shop${Date.now()}`,itemId:id,price:Math.floor(ITEMS[id].price*0.8),quantity:1};});}let html=`<div class="player-id">编号: ${playerId}</div><div class="title">商店 💰${metaState.coins}</div><p>可刷新: ${avail.available}</p>`;if(avail.available>0)html+=`<button class="btn small" onclick="window.__refreshShop()">刷新商店</button>`;html+=metaState.shopItems.map(item=>{const it=ITEMS[item.itemId];return`<div class="flex-row"><span>${it.icon}${it.name}</span> x${item.quantity} ${item.price}💰<button class="btn small buy-btn" data-id="${item.id}">购买</button></div>`;}).join('');html+=`<button class="btn" id="back-shop">返回</button>`;screens.shop.innerHTML=html;window.__refreshShop=()=>{if(avail.available<=0){showToast('刷新次数不足',true);return;}metaState.shopRefreshCount=(metaState.shopRefreshCount||0)+1;metaState.shopItems=[];renderShop();};document.querySelectorAll('.buy-btn').forEach(b=>b.onclick=(e)=>{const item=metaState.shopItems.find(i=>i.id===e.target.dataset.id);if(!item)return;let price=item.price;if(metaState.ownedCharacters.includes('sunsheng'))price=Math.floor(price*0.75);if(metaState.coins<price){showToast('金币不足',true);playPreloaded('de_kick',0.7);return;}metaState.coins-=price;const ex=metaState.warehouse.find(i=>i.itemId===item.itemId);if(ex)ex.quantity++;else metaState.warehouse.push({itemId:item.itemId,quantity:1});metaState.shopItems=metaState.shopItems.filter(i=>i.id!==item.id);playPreloaded('kick',0.7);renderShop();});document.getElementById('back-shop').onclick=()=>navigate('start'); }
    function renderWarehouse(){ const w=metaState.warehouse.reduce((s,i)=>s+(ITEMS[i.itemId]?.weight||1)*i.quantity,0);let html=`<div class="player-id">编号: ${playerId}</div><div class="title">仓库 📦${w}/${metaState.warehouseCapacity}</div><button class="btn small" id="upgrade-warehouse">升级容量 ${WAREHOUSE_UPGRADE_COST}💰</button>`;html+=metaState.warehouse.map(i=>{const it=ITEMS[i.itemId];return`<div class="flex-row"><span>${it.icon}${it.name}</span> x${i.quantity}<button class="btn small move-safebox" data-id="${i.itemId}">转至安全箱</button><button class="btn small sell-warehouse" data-id="${i.itemId}">出售</button></div>`;}).join('');html+=`<button class="btn" id="back-warehouse">返回</button>`;screens.warehouse.innerHTML=html;document.querySelectorAll('.move-safebox').forEach(b=>b.onclick=(e)=>{const id=e.target.dataset.id;const item=metaState.warehouse.find(i=>i.itemId===id);if(!item)return;const sw=metaState.safeBox.reduce((s,i)=>s+(ITEMS[i.itemId]?.weight||1)*i.quantity,0);if(sw+(ITEMS[id]?.weight||1)>metaState.safeBoxCapacity){showToast('安全箱已满',true);playPreloaded('de_kick',0.7);return;}if(item.quantity>1)item.quantity--;else metaState.warehouse=metaState.warehouse.filter(i=>i.itemId!==id);const ex=metaState.safeBox.find(i=>i.itemId===id);if(ex)ex.quantity++;else metaState.safeBox.push({itemId:id,quantity:1});playPreloaded('kick',0.7);renderWarehouse();});document.querySelectorAll('.sell-warehouse').forEach(b=>b.onclick=(e)=>{const id=e.target.dataset.id;const item=metaState.warehouse.find(i=>i.itemId===id);if(!item)return;const price=Math.floor(ITEMS[id].price*0.5);metaState.coins+=price;if(item.quantity>1)item.quantity--;else metaState.warehouse=metaState.warehouse.filter(i=>i.itemId!==id);showToast(`出售 ${ITEMS[id].name} 获得 ${price}💰`);renderWarehouse();});document.getElementById('upgrade-warehouse').onclick=()=>{if(metaState.coins<WAREHOUSE_UPGRADE_COST){showToast('金币不足',true);return;}metaState.coins-=WAREHOUSE_UPGRADE_COST;metaState.warehouseCapacity+=WAREHOUSE_UPGRADE_INCREMENT;renderWarehouse();};document.getElementById('back-warehouse').onclick=()=>navigate('start'); }
    function renderSafebox(){ const w=metaState.safeBox.reduce((s,i)=>s+(ITEMS[i.itemId]?.weight||1)*i.quantity,0);let html=`<div class="player-id">编号: ${playerId}</div><div class="title">安全箱 📦${w}/${metaState.safeBoxCapacity}</div><button class="btn small" id="upgrade-safebox">升级容量 ${SAFEBOX_UPGRADE_COST}💎</button>`;html+=metaState.safeBox.map(i=>{const it=ITEMS[i.itemId];return`<div class="flex-row"><span>${it.icon}${it.name}</span> x${i.quantity}<button class="btn small move-warehouse" data-id="${i.itemId}">转至仓库</button><button class="btn small take-for-expedition" data-id="${i.itemId}">带入远征</button></div>`;}).join('');html+=`<button class="btn" id="back-safebox">返回</button>`;screens.safebox.innerHTML=html;document.querySelectorAll('.move-warehouse').forEach(b=>b.onclick=(e)=>{const id=e.target.dataset.id;const item=metaState.safeBox.find(i=>i.itemId===id);if(!item)return;const ww=metaState.warehouse.reduce((s,i)=>s+(ITEMS[i.itemId]?.weight||1)*i.quantity,0);if(ww+(ITEMS[id]?.weight||1)>metaState.warehouseCapacity){showToast('仓库已满',true);return;}if(item.quantity>1)item.quantity--;else metaState.safeBox=metaState.safeBox.filter(i=>i.itemId!==id);const exist=metaState.warehouse.find(i=>i.itemId===id);if(exist)exist.quantity++;else metaState.warehouse.push({itemId:id,quantity:1});renderSafebox();});document.querySelectorAll('.take-for-expedition').forEach(b=>b.onclick=(e)=>{const id=e.target.dataset.id;prepSafeItems=[{itemId:id,quantity:1}];navigate('prep');});document.getElementById('upgrade-safebox').onclick=()=>{if(metaState.diamonds<SAFEBOX_UPGRADE_COST){showToast('钻石不足',true);return;}metaState.diamonds-=SAFEBOX_UPGRADE_COST;metaState.safeBoxCapacity+=SAFEBOX_UPGRADE_INCREMENT;renderSafebox();};document.getElementById('back-safebox').onclick=()=>navigate('start'); }
    function renderTalent(){ let html=`<div class="player-id">编号: ${playerId}</div><div class="title">天赋 💰${metaState.coins}</div>`;html+=TALENTS.map(t=>{const lv=metaState.talents[t.id]||0;return`<div class="flex-row"><span>${t.name} ${lv}/${t.maxLevel}</span><button class="btn small upg-talent" data-id="${t.id}" ${lv>=t.maxLevel?'disabled':''}>升级</button></div>`;}).join('');html+=`<button class="btn" id="back-talent">返回</button>`;screens.talent.innerHTML=html;document.querySelectorAll('.upg-talent').forEach(b=>b.onclick=(e)=>{const id=e.target.dataset.id;const talent=TALENTS.find(t=>t.id===id);if(!talent)return;const lv=metaState.talents[id]||0;if(lv>=talent.maxLevel)return;if(metaState.coins<talent.cost){showToast('金币不足',true);playPreloaded('de_kick',0.7);return;}metaState.coins-=talent.cost;metaState.talents[id]=lv+1;playPreloaded('kick',0.7);renderTalent();});document.getElementById('back-talent').onclick=()=>navigate('start'); }
    function renderCrewSelect(){ let html=`<div class="player-id">编号: ${playerId}</div><div class="title">编队</div>`;metaState.ownedCharacters.forEach(id=>{const c=CHARACTERS[id];if(!c)return;const sel=metaState.selectedCrewIds.includes(id);html+=`<div class="flex-row"><span>${c.icon}${c.name}</span><button class="btn small toggle-crew" data-id="${id}">${sel?'移除':'选择'}</button></div>`;});html+=`<button class="btn" id="save-crew">保存</button><button class="btn" id="back-crew">返回</button>`;screens.crewselect.innerHTML=html;document.querySelectorAll('.toggle-crew').forEach(b=>b.onclick=(e)=>{const id=e.target.dataset.id;if(metaState.selectedCrewIds.includes(id)){if(metaState.selectedCrewIds.length<=1){showToast('至少保留一人',true);return;}metaState.selectedCrewIds=metaState.selectedCrewIds.filter(i=>i!==id);}else{if(metaState.selectedCrewIds.length>=4){showToast('最多四人',true);return;}metaState.selectedCrewIds.push(id);}renderCrewSelect();});document.getElementById('save-crew').onclick=()=>{showToast('编队已保存');navigate('start');};document.getElementById('back-crew').onclick=()=>navigate('start'); }
    function renderSettings(){ let html=`<div class="player-id">编号: ${playerId}</div><div class="title">设置</div><button class="btn" id="back-settings">返回</button>`;screens.settings.innerHTML=html;document.getElementById('back-settings').onclick=()=>navigate('start'); }
    function renderPedia(){ let html=`<div class="player-id">编号: ${playerId}</div><div class="title">道具图鉴</div><div id="pedia-items"></div><button class="btn" id="back-pedia">返回</button>`;screens.pedia.innerHTML=html;const itemsDiv=document.getElementById('pedia-items');itemsDiv.innerHTML=Object.values(ITEMS).map(i=>{const cls=getItemColorClass(i.star);return`<div class="item-detail-row"><span class="${cls}">${i.icon} ${i.name}</span><p>${i.desc}</p></div>`;}).join('');document.getElementById('back-pedia').onclick=()=>navigate('start'); }
    function renderArchive(){ let html=`<div class="player-id">编号: ${playerId}</div><div class="title">角色档案</div>`;Object.values(CHARACTERS).forEach(c=>{html+=`<div class="archive-card" data-char="${c.id}"><span>${c.icon} ${c.name}</span></div>`;});html+=`<button class="btn" id="back-archive">返回</button>`;screens.archive.innerHTML=html;screens.archive.querySelectorAll('.archive-card').forEach(card=>card.onclick=(e)=>{navigate('archiveDetail',{charId:card.dataset.char});});document.getElementById('back-archive').onclick=()=>navigate('start'); }
    function renderArchiveDetail(params){ const char=CHARACTERS[params.charId];if(!char)return;let html=`<div class="player-id">编号: ${playerId}</div><div class="title">${char.name}</div><div class="crew-card"><p>${char.desc}</p><p>背景：${char.background||'未知'}</p><p>技能：${char.skill.type==='none'?'无':char.skill.type}</p><h4>命座</h4>${char.constellations.map(c=>`<span class="constellation-node">${c}</span>`).join('')}</div><button class="btn" id="back-archive-detail">返回</button>`;screens.archiveDetail.innerHTML=html;document.getElementById('back-archive-detail').onclick=()=>navigate('archive'); }
    function renderAchievement(){ let html=`<div class="player-id">编号: ${playerId}</div><div class="title">成就</div>`;ACHIEVEMENTS.forEach(a=>{const done=metaState.achievements[a.id];html+=`<div class="crew-card"><span>${done?'✅':'⬜'} ${a.name}: ${a.desc}</span></div>`;});html+=`<button class="btn" id="back-ach">返回</button>`;screens.achievement.innerHTML=html;document.getElementById('back-ach').onclick=()=>navigate('start'); }
    function renderPrep(){ let html=`<div class="player-id">编号: ${playerId}</div><div class="title">准备远征</div><div>选择难度</div>`;Object.entries(DIFFICULTY).forEach(([k,v])=>html+=`<button class="btn small ${prepDifficulty===k?'selected-option':''}" data-diff="${k}">${v.name}</button>`);html+=`<div>从安全箱带入</div><div id="prep-items"></div><button class="btn" id="start-game">出发</button><button class="btn danger" id="back-start">返回</button>`;screens.prep.innerHTML=html;screens.prep.querySelectorAll('[data-diff]').forEach(b=>b.onclick=(e)=>{prepDifficulty=e.target.dataset.diff;renderPrep();});renderPrepItems();document.getElementById('start-game').onclick=()=>{if(!prepDifficulty)return showToast('选择难度',true);gameState=createGameState(metaState,prepSafeItems,prepDifficulty);prepSafeItems.forEach(({itemId,quantity})=>{for(let i=0;i<quantity;i++)removeFromSafebox(itemId);});navigate('game');};document.getElementById('back-start').onclick=()=>navigate('start'); }
    function renderPrepItems(){ const cont=document.getElementById('prep-items');if(!cont)return;cont.innerHTML=metaState.safeBox.map(item=>{const it=ITEMS[item.itemId];const sel=prepSafeItems.find(i=>i.itemId===item.itemId);const qty=sel?.quantity||0;return`<div class="flex-row"><span>${it.icon}${it.name}</span> 拥有${item.quantity}<button class="inc" data-id="${item.itemId}">+</button><span>${qty}</span><button class="dec" data-id="${item.itemId}">-</button></div>`;}).join('');cont.querySelectorAll('.inc').forEach(b=>b.onclick=()=>{const id=b.dataset.id;const item=metaState.safeBox.find(i=>i.itemId===id);if(!item)return;const cur=prepSafeItems.find(i=>i.itemId===id)?.quantity||0;if(cur<item.quantity){prepSafeItems=prepSafeItems.filter(i=>i.itemId!==id);prepSafeItems.push({itemId:id,quantity:cur+1});renderPrep();}});cont.querySelectorAll('.dec').forEach(b=>b.onclick=()=>{const id=b.dataset.id;const sel=prepSafeItems.find(i=>i.itemId===id);if(!sel)return;let newItems=prepSafeItems.filter(i=>i.itemId!==id);if(sel.quantity>1)newItems.push({itemId:id,quantity:sel.quantity-1});prepSafeItems=newItems;renderPrep();}); }
    function removeFromSafebox(itemId){ const idx=metaState.safeBox.findIndex(i=>i.itemId===itemId);if(idx>=0){if(metaState.safeBox[idx].quantity>1)metaState.safeBox[idx].quantity--;else metaState.safeBox.splice(idx,1);} }
    function openTaskModal(cid,already){ const crew=gameState.crew.find(c=>c.id===cid);let tasks=[{task:'scavenge',name:'搜寻'},{task:'repair',name:'维修'},{task:'medical',name:'医疗'},{task:'rest',name:'休息'}];if(already)tasks=tasks.filter(t=>t.task!=='scavenge');modalContainer.innerHTML=`<div class="modal-overlay"><div class="modal-content"><h3>为${crew.name}分配</h3>${tasks.map(t=>`<button class="btn" data-task="${t.task}">${t.name}</button>`).join('')}<button class="btn danger close-modal">取消</button></div></div>`;modalContainer.classList.remove('hidden');modalContainer.querySelectorAll('[data-task]').forEach(b=>b.onclick=(e)=>{const task=e.target.dataset.task;if(task==='scavenge'){modalContainer.classList.add('hidden');selectLocationWithItems(cid);}else if(task==='repair'){modalContainer.classList.add('hidden');selectModule(cid);}else{assignTask(cid,task);modalContainer.classList.add('hidden');}});modalContainer.querySelector('.close-modal').onclick=()=>modalContainer.classList.add('hidden'); }
    function selectLocationWithItems(cid){ let sel=null;const render=()=>{let html=`<div class="modal-overlay"><div class="modal-content"><h3>选择搜寻地点</h3>`;LOCATIONS.forEach(loc=>{html+=`<div><button class="btn small ${sel===loc.id?'selected-option':''}" data-loc="${loc.id}">${loc.icon}${loc.name}</button></div>`;});html+=`<button class="btn" id="confirm-loc">确认出发</button></div></div>`;modalContainer.innerHTML=html;modalContainer.classList.remove('hidden');modalContainer.querySelectorAll('[data-loc]').forEach(b=>b.onclick=(e)=>{sel=e.target.dataset.loc;render();});document.getElementById('confirm-loc').onclick=()=>{if(!sel)return showToast('请选择地点',true);assignTask(cid,'scavenge',sel);modalContainer.classList.add('hidden');};};render(); }
    function selectModule(cid){ const mods=Object.entries(gameState.modules).filter(([k,v])=>v<1);if(mods.length===0){showToast('没有需要维修的模块',true);return;}modalContainer.innerHTML=`<div class="modal-overlay"><div class="modal-content"><h3>选择维修模块</h3>${mods.map(([m])=>`<button class="btn" data-mod="${m}">${ICONS[m]} ${MODULES[m.toUpperCase()]||m}</button>`).join('')}<button class="btn danger close-modal">取消</button></div></div>`;modalContainer.classList.remove('hidden');modalContainer.querySelectorAll('[data-mod]').forEach(b=>b.onclick=(e)=>{assignTask(cid,'repair',null,e.target.dataset.mod);modalContainer.classList.add('hidden');}); }
    function assignTask(cid,task,locId=null,mod=null){ gameState.dailyAssignments[cid]={task,locationId:locId,module:mod};renderGame(); }
    const loadingOverlay=document.getElementById('loading-overlay'),loadProgress=document.getElementById('load-progress');let prog=0;const interval=setInterval(()=>{prog+=5;loadProgress.style.width=prog+'%';if(prog>=100){clearInterval(interval);setTimeout(()=>{loadingOverlay.style.opacity='0';setTimeout(()=>{loadingOverlay.classList.add('hidden');const savedMeta=storage.get('tides_meta_v17');if(savedMeta)metaState={...createMetaState(),...savedMeta,gameSettings:{...createMetaState().gameSettings,...(savedMeta.gameSettings||{})}};bgmEnabled=metaState.gameSettings.musicEnabled;sfxEnabled=metaState.gameSettings.sfxEnabled;if(bgmEnabled)updateBgm('start');renderStart();navigate('start');},200);},100);}},20);
    logFloatBtn.onclick=showLogModal;setInterval(()=>requestAutoSave(),10000);
})();
